# …省略触发和权限设置…
jobs:
  build:
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.x'
          bundler-cache: true
      - run: bundle install
      - run: bundle exec jekyll build -d _site
      - uses: actions/upload-pages-artifact@v1   # ← 一定要是 v1
        with:
          path: ./_site

  deploy:
    needs: build
    steps:
      - uses: actions/deploy-pages@v1           # ← 一定要是 v1
