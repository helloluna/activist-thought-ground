title: Activist Thought Ground
baseurl: "/activist-thought-ground"  # matches your repo name
url: "https://helloluna.github.io"
theme: null
markdown: kramdown
kramdown:
  input: GFM

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections and Permalinks
permalink: pretty

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      author: "Hanyu Liu"

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Optional extras
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."
