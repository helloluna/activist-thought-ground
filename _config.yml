# ─── 元信息 ──────────────────────────────────────
title: "Activist Thought Ground"
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

url: "https://helloluna.github.io"
baseurl: "/activist-thought-ground"

# ─── 使用远程主题 ─────────────────────────────────
remote_theme: "mmistakes/minimal-mistakes"

# 必须启用这个插件，才能用 remote_theme
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

# 告诉 Jekyll 压缩输出 Sass
sass:
  style: compressed

# Markdown 引擎
markdown: kramdown
kramdown:
  input: GFM

# ─── Collections ─────────────────────────────────
collections:
  chapters:
    output: true
    permalink: /chapters/:name/

# ─── 默认布局 ────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: single
      author: "Hanyu Liu"
      read_time: true
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: pages
    values:
      layout: home
      author: "Hanyu Liu"

# ─── 排除不需要编译的文件 ──────────────────────────
exclude:
  - node_modules
  - vendor
