title: Activist Thought Ground
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

# GitHub Pages base settings
baseurl: "/activist-thought-ground"
url: "https://helloluna.github.io"

theme: null  # 使用自定义主题

markdown: kramdown
kramdown:
  input: GFM

# Plugins: 只用 GitHub Pages 官方允许的
plugins:
  - jekyll-feed
  - jekyll-seo-tag

  permalink: pretty

# Collection for chapters
collections:
  chapters:
    output: true
    permalink: /chapters/:name/

include:
  - _chapters

defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: chapter
      author: "Hanyu Liu"
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author: "Hanyu Liu"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
