title: "Activist Thought Ground"
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

url: "https://helloluna.github.io"
baseurl: "/activist-thought-ground"

# 本地主题（非 remote_theme）
theme: minimal-mistakes-jekyll

# 自定义皮肤与 CSS 覆盖
minimal_mistakes_skin: "default"
assets:
  css:
    - "/assets/css/custom-override.css"

# 插件（GitHub Pages 默认支持）
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

# Markdown 设置
markdown: kramdown
kramdown:
  input: GFM

# 自定义章节 collection
collections:
  chapters:
    output: true
    permalink: /chapters/:name/

# 默认布局与设置
defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: single
      author: "Hanyu Liu"
      read_time: true
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: pages
    values:
      layout: home
      author: "Hanyu Liu"

# 排除项
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
