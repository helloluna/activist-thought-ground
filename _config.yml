title: "Activist Thought Ground"
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

url: "https://helloluna.github.io"
baseurl: "/activist-thought-ground"

remote_theme: "mmistakes/minimal-mistakes"

# 强制加载自定义 CSS
minimal_mistakes_skin: "default"
assets:
  css:
    - "/assets/css/custom-override.css"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

markdown: kramdown
kramdown:
  input: GFM

# 自定义内容集合
collections:
  chapters:
    output: true
    permalink: /chapters/:name/

# 页面与章节默认布局
defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: single
      author: "Hanyu Liu"
      read_time: true
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: pages
    values:
      layout: home
      author: "Hanyu Liu"

# 编译排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor 
      
