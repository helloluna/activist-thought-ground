title: Activist Thought Ground
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

baseurl: "/activist-thought-ground"
url: "https://helloluna.github.io"
theme: null

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  chapters:
    output: true
    permalink: /chapters/:name/

include:
  - _chapters

defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: chapter
      author: "Hanyu Liu"

  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author: "Hanyu Liu"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
