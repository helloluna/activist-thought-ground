title: Activist Thought Ground
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

# GitHub Pages base settings
baseurl: "/activist-thought-ground"  # matches your repository name
url: "https://helloluna.github.io"

# Theme is null because you're using a custom layout (Tufte-based)
theme: null

# Markdown parser
markdown: kramdown
kramdown:
  input: GFM

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collection for chapters
collections:
  chapters:
    output: true
    permalink: /chapters/:name/

include:
  - _chapters

# Defaults
defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: chapter
      author: "Hanyu Liu"
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author: "Hanyu Liu"

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
