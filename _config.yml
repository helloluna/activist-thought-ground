title: "Activist Thought Ground"
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

url: "https://helloluna.github.io"
baseurl: "/activist-thought-ground"

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "default"
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

markdown: kramdown
kramdown:
  input: GFM

collections:
  chapters:
    output: true
    permalink: /chapters/:name/

defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: single
      author: "Hanyu Liu"
      read_time: true
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: pages
    values:
      layout: home
      author: "Hanyu Liu"

exclude:
  - node_modules
  - vendor
