title: "Activist Thought Ground"
description: "Philosophical reflections on animal ethics, structural violence, and the moral position of refusal."

url: "https://helloluna.github.io"
baseurl: "/activist-thought-ground"

# 使用本地主题
theme: minimal-mistakes-jekyll

# 加载自定义样式
minimal_mistakes_skin: "default"
assets:
  css:
    - "/assets/css/custom-override.css"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

markdown: kramdown
kramdown:
  input: GFM

collections:
  chapters:
    output: true
    permalink: /chapters/:name/

defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: single
      author: "Hanyu Liu"
      read_time: true
      toc: true
      toc_sticky: true

  - scope:
      path: ""
      type: pages
    values:
      layout: home
      author: "Hanyu Liu"

# 不再排除 Gemfile
exclude:
  - node_modules
  - vendor
